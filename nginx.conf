# ============================================================
# Configuración de Nginx para el Frontend React
# ============================================================
# Nginx hace DOS cosas:
#   1. Sirve los archivos estáticos del frontend React
#   2. Redirige peticiones /api/* al contenedor backend
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión Gzip ───────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── API: Redirigir al backend Laravel ─────────────────
    # Cuando el frontend llame a /api/usuarios, Nginx lo manda
    # al contenedor "backend" (nombre definido en docker-compose)
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Sanctum CSRF (si usas autenticación SPA) ──────────
    location /sanctum/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Archivos estáticos ────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA: React Router ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Límite de subida ──────────────────────────────────
    client_max_body_size 20M;
}
